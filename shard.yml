name: crysda
version: 0.4.1

authors:
  - Ali Naqvi <syed.alinaqvi@gmail.com>
description: |
  High-performance Crystal shard for data analysis. Provides DataFrame operations
  with optimized column storage, SIMD acceleration, and a dplyr/pandas-inspired API
  for filtering, transforming, aggregating, and reshaping tabular data.

crystal: ~> 1.0

dependencies:
  db:
    github: crystal-lang/crystal-db

development_dependencies:
  sqlite3:
    github: crystal-lang/crystal-sqlite3

license: MIT
